name: Alimentador com câmera
products:
  - id: z903y3w6fvxpznab
    name: Pet feeder with camera
entities:
  - entity: button
    name: Alimentar
    icon: "mdi:food-steak"
    dps:
      - id: 3
        name: button
        type: integer
        optional: true
        mapping:
          - dps_val: 1
            value: true
  - entity: sensor
    name: Estado
    class: enum
    icon: "mdi:information-outline"
    dps:
      - id: 4
        name: sensor
        type: string
        mapping:
          - dps_val: standby
            value: Em espera
          - dps_val: feeding
            value: Alimentando
          - dps_val: done
            value: Concluído
  - entity: sensor
    class: battery
    dps:
      - id: 10
        name: sensor
        type: integer
        unit: "%"
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 19
        name: sensor
        type: bitfield
  - entity: time
    name: Refeição 1
    icon: "mdi:clock-outline"
    category: config
    dps:
      - id: 1
        name: hour
        type: base64
        optional: true
        mask: "00FF0000000000000000000000000000000000000000000000\
               00000000000000000000000000000000000000000000000000"
      - id: 1
        name: minute
        type: base64
        optional: true
        mask: "0000FF00000000000000000000000000000000000000000000\
               00000000000000000000000000000000000000000000000000"
  - entity: number
    name: Refeição 1 porções
    icon: "mdi:food-drumstick"
    category: config
    dps:
      - id: 1
        name: value
        type: base64
        optional: true
        mask: "000000FF000000000000000000000000000000000000000000\
               00000000000000000000000000000000000000000000000000"
        range:
          min: 1
          max: 12
  - entity: switch
    name: Refeição 1 ativa
    icon: "mdi:calendar-check"
    category: config
    dps:
      - id: 1
        name: switch
        type: base64
        optional: true
        mask: "00000000FF0000000000000000000000000000000000000000\
               00000000000000000000000000000000000000000000000000"
